<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christina W, Visual Designer</title>
  <meta name="description" content="Christina W is a visual designer working across brand visuals, Amazon store content, packaging and posters.">
  <script>try { history.scrollRestoration = 'manual'; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Reenie+Beanie&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#index">Skip to work</a>

  <header class="site-head">
    <a class="brand" href="#top" data-t="name">Christina W</a>
    <nav class="nav" aria-label="Sections">
      <a href="#resume">Resume</a>
      <a href="#index">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <!-- ───────── Cover ───────── -->
    <div class="cover-pin">
      <section class="page cover">
        <h1 class="hand cover-title" data-t="cover" data-write="pin">Christina W</h1>
        <figure class="cutout"><img src="images/christina-w.jpg" alt="Portrait of Christina W" width="1400" height="1400"></figure>
      </section>
    </div>

    <!-- ───────── Hello ───────── -->
    <section class="page hello">
      <p class="display hello-text reveal" data-t="hello"></p>
      <div class="detail reveal">
        <h2 class="label">Detail</h2>
        <p data-t="bio"></p>
      </div>
    </section>

    <!-- ───────── Feature: international e-commerce ───────── -->
    <section class="dark seas" id="seas">
      <div class="seas-head">
        <h2 class="seas-title display reveal"><span data-f="lead"></span> <em data-f="accent"></em></h2>
        <div class="seas-foot">
          <p class="seas-text reveal" data-f="text"></p>
          <dl class="seas-facts reveal" id="seas-facts"></dl>
        </div>
      </div>
      <div class="seas-reel"><div class="seas-track" id="seas-track"></div></div>
    </section>

    <!-- ───────── Resume ───────── -->
    <section class="page resume" id="resume">
      <div class="page-top reveal"><h2 class="label">Resume</h2><span><span data-t="name"></span> Portfolio</span></div>
      <div class="resume-grid">
        <div class="resume-id reveal">
          <p class="display sig" data-t="name"></p>
          <p class="label" data-t="role"></p>
          <img class="avatar" src="images/christina-w.jpg" alt="" width="1400" height="1400" loading="lazy">
          <dl class="id-list">
            <div><dt>e-mail</dt><dd><a data-mail href="#" data-t="email"></a></dd></div>
          </dl>
        </div>
        <div class="resume-body" id="resume-body"></div>
      </div>
    </section>

    <!-- ───────── Index ───────── -->
    <section class="page index" id="index">
      <h2 class="label reveal">Index</h2>
      <div class="index-list reveal">
        <h3 class="label">Work</h3>
        <ol id="work-index"></ol>
      </div>
    </section>

    <!-- ───────── Work: one black chapter per role ───────── -->
    <div class="dark" id="chapters"></div>

    <!-- ───────── Contact ───────── -->
    <section class="page contact" id="contact">
      <div class="page-top reveal"><h2 class="label">Contact</h2><span><span data-t="name"></span> Portfolio</span></div>
      <p class="display thanks reveal">Thank you</p>
      <dl class="id-list reveal">
        <div><dt>e-mail</dt><dd><a data-mail href="#" data-t="email"></a></dd></div>
      </dl>
      <ul class="socials" id="socials"></ul>
    </section>
  </main>

  <footer class="site-foot">
    <span>© <span id="yr"></span> <span data-t="name"></span></span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <!-- ───────── Viewer ───────── -->
  <dialog class="lb dark" id="lb" aria-label="Project viewer">
    <div class="lb-bar">
      <span class="lb-count"></span>
      <button class="lb-close" type="button">Close <kbd>Esc</kbd></button>
    </div>
    <div class="lb-body">
      <div class="lb-stage"><div class="lb-media"></div></div>
      <aside class="lb-side">
        <p class="lb-kicker"></p>
        <h3 class="lb-title"></h3>
        <p class="lb-note"></p>
        <dl class="lb-meta"></dl>
        <div class="lb-nav">
          <button type="button" data-step="-1" aria-label="Previous">←</button>
          <button type="button" data-step="1" aria-label="Next">→</button>
        </div>
      </aside>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
