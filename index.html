<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christina W, Visual Designer</title>
  <meta name="description" content="Christina W is a visual designer working across brand visuals, Amazon store content, packaging and posters.">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    try {
      var ty = new URLSearchParams(location.search).get('type') || localStorage.getItem('type');
      if (ty && ty !== 'editorial') document.documentElement.dataset.type = ty;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400..700&family=Archivo:wdth,wght@62..125,400..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#posters">Skip to work</a>

  <header class="site-head">
    <a class="brand" href="#top" data-t="name">Christina W</a>
    <nav class="nav" aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="head-right">
      <button class="theme" id="theme" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- ───────── Hero ───────── -->
    <section class="hero">
      <p class="eyebrow"><span data-t="role"></span><span data-t="since"></span></p>
      <h1><em>Christina W</em> designs brand visuals, Amazon store content, packaging <span class="amp">&amp;</span> posters.</h1>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <!-- ───────── Work: overview, then one chapter per role ───────── -->
    <section class="section" id="work">
      <h2 class="vh">Work</h2>
      <div class="xp" id="work-index"></div>
    </section>
    <div id="chapters"></div>

    <!-- ───────── About ───────── -->
    <section class="section" id="about">
      <header class="sec-head">
        <div class="sec-top"><span data-n="1"></span><span></span></div>
        <div class="sec-main"><h2>About</h2></div>
      </header>
      <div class="about">
        <div class="about-top">
          <figure class="portrait reveal">
            <img src="images/christina-w.jpg" alt="Portrait of Christina W" width="1400" height="1400" loading="lazy">
            <figcaption><span data-t="name"></span><span data-t="role"></span></figcaption>
          </figure>
          <p class="about-lead reveal" data-t="bio"></p>
        </div>
        <div class="about-cols" id="about-cols"></div>
      </div>
    </section>

    <!-- ───────── Contact ───────── -->
    <section class="section contact" id="contact">
      <header class="sec-head">
        <div class="sec-top"><span data-n="2"></span><span></span></div>
        <div class="sec-main"><h2>Contact</h2></div>
      </header>
      <a class="mail reveal" data-mail href="#"><span data-t="email"></span><span class="arrow" aria-hidden="true">↗</span></a>
      <ul class="socials" id="socials"></ul>
    </section>
  </main>

  <footer class="site-foot">
    <span>© <span id="yr"></span> <span data-t="name"></span></span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <!-- ───────── Viewer ───────── -->
  <dialog class="lb" id="lb" aria-label="Project viewer">
    <div class="lb-bar">
      <span class="lb-count"></span>
      <button class="lb-close" type="button">Close <kbd>Esc</kbd></button>
    </div>
    <div class="lb-body">
      <div class="lb-stage"><div class="lb-media"></div></div>
      <aside class="lb-side">
        <p class="lb-kicker"></p>
        <h3 class="lb-title"></h3>
        <p class="lb-note"></p>
        <dl class="lb-meta"></dl>
        <div class="lb-nav">
          <button type="button" data-step="-1" aria-label="Previous">←</button>
          <button type="button" data-step="1" aria-label="Next">→</button>
        </div>
      </aside>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
